# Host-based routing for 3 frontend environments (Next.js standalone servers on loopback).
# Install on Droplet:
#   sudo cp this-file /etc/nginx/conf.d/sporgates-frontend-multi.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS:
#   sudo certbot --nginx -d sporgates.com -d www.sporgates.com -d qa.sporgates.com -d dev.sporgates.com
#
# Default nginx client_max_body_size is 1m — large JSON/API uploads (proxy to Spring) need more (413 otherwise).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name sporgates.com www.sporgates.com;
    client_max_body_size 50m;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name qa.sporgates.com;
    client_max_body_size 50m;

    location ^~ /.well-known/acme-challenge/ {
