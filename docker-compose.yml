# Run the frontend only. Set NEXT_PUBLIC_API_URL to your backend API base URL (e.g. http://localhost:8080/api).
# Backend runs in its own repo (Sporgates-backend).

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api}
    container_name: sporgates-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api}
